pluginManagement {
    repositories {
        gradlePluginPortal()
        google()          // the Android Gradle Plugin lives here, not on the portal
        mavenCentral()
    }
}

// Lets `./gradlew updateDaemonJvm` record which JDK builds this project, and
// lets a machine without that JDK download one. Without it, updateDaemonJvm
// fails with "Toolchain download repositories have not been configured".
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = 'corbelsflightlog'

include ':core'
include ':pedro'
include ':wpilib'

// The FTC module is an Android library: it needs the Android SDK and the FTC
// SDK, which a plain JVM build doesn't have. Include it only when an Android
// SDK is present (local.properties, ANDROID_HOME or ANDROID_SDK_ROOT), so
// `./gradlew build` works anywhere and CI can still build it on a runner with
// the SDK installed.
def hasAndroidSdk = file('local.properties').exists() ||
        System.getenv('ANDROID_HOME') || System.getenv('ANDROID_SDK_ROOT')
if (hasAndroidSdk) {
    include ':ftc'
    include ':checks'
} else {
    logger.lifecycle('corbelsflightlog: no Android SDK found, skipping :ftc and :checks')
}
