name: Release

# Tag a commit to release:  git tag v1.2.3 && git push origin v1.2.3
# JitPack builds the tag on first request, so teams can depend on it with no
# publishing step here. The jars are attached to the GitHub Release as well.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      # :ftc is included automatically: the runner's own Android SDK sets
      # ANDROID_HOME, which settings.gradle looks for.
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the version in gradle.properties
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match version=$VERSION in gradle.properties"
            echo "Releasing means: set version=$TAG in gradle.properties (drop -SNAPSHOT),"
            echo "commit that, then tag the commit."
            exit 1
          fi

      - name: Test and build
        run: ./gradlew build --stacktrace

      - name: Attach the jars to the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            core/build/libs/*.jar
            pedro/build/libs/*.jar
            wpilib/build/libs/*.jar
            ftc/build/outputs/aar/*.aar

      # Documentation for this version, published alongside the others.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r docs/requirements.txt
      - name: Build the docs and the Javadoc
        run: |
          ./gradlew :core:javadoc :pedro:javadoc :wpilib:javadoc :ftc:javadoc
          python docs/build_site.py --version "$GITHUB_REF_NAME"
      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_site
          keep_files: true          # keep the other versions already published
