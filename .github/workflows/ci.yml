name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Build and test (core, pedro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repo ships gradle-wrapper.jar; check it is a genuine release.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports/tests/test'
          if-no-files-found: ignore

  wpilib-parity:
    name: WPILib parity (robotpy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      # Write the .wpilog files with OUR writer. --rerun defeats up-to-date
      # checks and the build cache, so the files are always produced here
      # rather than fetched from another job.
      - name: Write the comparison files
        run: ./gradlew :core:test --tests '*ParityFilesTest*' --rerun --stacktrace
      - name: Fail if the test skipped itself and wrote nothing
        run: test -n "$(ls -A core/build/logcheck 2>/dev/null)" ||
             { echo 'ParityFilesTest produced no files -- it probably could not find tools/logcheck/scenario.tsv'; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/logcheck/requirements.txt
      # Compares our files byte-for-byte against WPILib's own native writer.
      - run: python -m unittest discover -s tools/logcheck -v
      - name: Upload the compared files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcheck-files
          path: core/build/logcheck
          if-no-files-found: warn

  android:
    name: Build the FTC module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      # GitHub's ubuntu runners already ship the Android SDK with ANDROID_HOME
      # set, which is what settings.gradle looks for -- so no setup action is
      # needed. (android-actions/setup-android@v3 is what was failing here.)
      - name: Show the Android SDK the runner provides
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -n "$ANDROID_HOME" || { echo 'No Android SDK on this runner.'; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
      - name: Fail early if settings.gradle did not include :ftc
        run: ./gradlew projects | grep -q "':ftc'" || {
             echo 'The :ftc module was not included -- no Android SDK was detected.'; exit 1; }
      - run: ./gradlew :ftc:assembleRelease --stacktrace
      - name: Upload the AAR
        uses: actions/upload-artifact@v4
        with:
          name: ftc-aar
          path: ftc/build/outputs/aar/*.aar
          if-no-files-found: error
