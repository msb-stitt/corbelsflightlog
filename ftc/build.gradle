plugins {
    // A version is required: the plugin is resolved through pluginManagement
    // in settings.gradle, from google().
    id 'com.android.library' version '8.13.2'
    id 'maven-publish'
}

description = 'FTC glue: log to the Control Hub, mirror values to Panels.'

android {
    namespace = 'io.github.mikestitt.corbelsflightlog.ftc'
    compileSdk 34              // Panels pulls Material Components, which needs 34

    defaultConfig {
        minSdk 24              // the FTC SDK's minimum
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    publishing { singleVariant('release') }

    testOptions {
        // Android classes are empty stubs in JVM unit tests; without this they
        // throw instead of returning defaults.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    api project(':core')
    // compileOnly: the robot project supplies its own FTC SDK and Panels.
    compileOnly "org.firstinspires.ftc:RobotCore:${ftcSdkVersion}"
    compileOnly "com.bylazar:fullpanels:${panelsVersion}"
    // @WebHandlerRegistrar lives in FtcCommon; the web handlers return
    // NanoHTTPD responses. Both are supplied by the Robot Controller at
    // runtime -- compileOnly, so no version is forced on the robot project.
    compileOnly "org.firstinspires.ftc:FtcCommon:${ftcSdkVersion}"
    compileOnly "org.nanohttpd:nanohttpd:${nanohttpdVersion}"
    // compileOnly does not extend the test classpath, so the unit tests need
    // these declared again.
    testImplementation "org.firstinspires.ftc:RobotCore:${ftcSdkVersion}"
    testImplementation "org.firstinspires.ftc:FtcCommon:${ftcSdkVersion}"
    testImplementation "org.nanohttpd:nanohttpd:${nanohttpdVersion}"
    testImplementation 'junit:junit:4.13.2'
}

afterEvaluate {
    publishing {
        publications {
            maven(MavenPublication) {
                artifactId = 'corbelsflightlog-ftc'
                from components.release
            }
        }
    }
}

// The API reference. The Android plugin makes no Javadoc task of its own, so
// this one is the plain Java one, given Android's classes and the compile
// classpath to resolve against.
tasks.register('javadoc', Javadoc) {
    def variant = android.libraryVariants.find { it.name == 'release' }
    source = android.sourceSets.main.java.srcDirs
    classpath = files(android.bootClasspath) + variant.javaCompileProvider.get().classpath
    destinationDir = layout.buildDirectory.dir('docs/javadoc').get().asFile
    options.links 'https://docs.oracle.com/en/java/javase/17/docs/api/'
    // The site puts each module's pages side by side under javadoc/.
    options.linksOffline '../core/', project(':core').layout.buildDirectory.dir('docs/javadoc').get().asFile.path
    dependsOn ':core:javadoc'
}
